# Premium dark theme for the AI Data Analyst workspace.
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0E1B2E"
textColor = "#E8EEF7"
linkColor = "#5EEAD4"
codeBackgroundColor = "#0B1626"
codeTextColor = "#C9D6E8"
borderColor = "#213553"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 500]
linkUnderline = false

greenColor = "#34D399"
redColor = "#FB7185"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = ["#2DD4BF", "#60A5FA", "#A78BFA", "#FBBF24", "#FB7185", "#34D399", "#F97316"]
chartSequentialColors = ["#06263A", "#073B53", "#075A70", "#087E91", "#0C9FA5", "#18B8AF", "#4FD1C5", "#86E3DA", "#BAF3EA", "#E7FFFA"]
dataframeBorderColor = "#213553"
dataframeHeaderBackgroundColor = "#10233A"

[theme.sidebar]
backgroundColor = "#091524"
secondaryBackgroundColor = "#0F2035"
textColor = "#E8EEF7"
borderColor = "#213553"
primaryColor = "#2DD4BF"
